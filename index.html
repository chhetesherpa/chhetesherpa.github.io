<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chhetesherpa | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #111;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }
    section {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }
    h2 {
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
    }
    .project {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
    }
    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    .project {
  background: white;
  padding: 20px;
  margin-top: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

  </style>
</head>
<body>

<header>
  <h1>Chhetesherpa</h1>
  <p>Developer | Learner | Builder</p>
</header>

<section>
  <h2>About Me</h2>
  <p>
    Hi! I'm Chhetesherpa. I enjoy building projects, learning new technologies,
    and sharing my work online.
  </p>
</section>

<section>
  <h2>Projects</h2>
  <div id="projects">Loading projects...</div>
</section>


</section>

<section>
  <h2>Contact</h2>
  <p>
    GitHub: <a href="https://github.com/chhetesherpa">github.com/chhetesherpa</a>
  </p>
</section>

<footer>
  © 2026 Chhetesherpa
</footer>

<script>
  const username = "chhetesherpa";
  const projectsContainer = document.getElementById("projects");

  fetch(`https://api.github.com/users/${username}/repos?sort=updated`)
    .then(response => response.json())
    .then(repos => {
      projectsContainer.innerHTML = "";

      repos
        .filter(repo => !repo.fork) // hide forks
        .slice(0, 6) // show latest 6 projects
        .forEach(repo => {
          const project = document.createElement("div");
          project.className = "project";

          project.innerHTML = `
            <h3>${repo.name}</h3>
            <p>${repo.description || "No description provided."}</p>
            <p>⭐ ${repo.stargazers_count}</p>
            <a href="${repo.html_url}" target="_blank">View on GitHub</a>
          `;

          projectsContainer.appendChild(project);
        });
    })
    .catch(() => {
      projectsContainer.innerHTML = "Unable to load projects.";
    });
</script>


  
</body>
</html>
